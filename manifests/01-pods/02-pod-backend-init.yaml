# =============================================================================
# Modulo 01: Pods: Contenedores y Ciclo de Vida
# Ejercicio 1.2: Inicialización con InitContainer para Validación de Dependencias
# Namespace Asignado: lab-pods
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: pod-backend-init
  namespace: lab-pods
  labels:
    tier: backend
spec:
  initContainers:
    - name: wait-db
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - |
          echo "Verificando disponibilidad de db-service:3306...";
          until nc -z -w 2 db-service 3306; do
            echo "Base de datos no alcanzable aún. Esperando 3s...";
            sleep 3;
          done;
          echo "¡Conexión establecida exitosamente!";
  containers:
    - name: backend-api
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
