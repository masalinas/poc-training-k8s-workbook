# =============================================================================
# Modulo 01: Pods: Contenedores y Ciclo de Vida
# Ejercicio 1.1: Pod Multi-contenedor con Volumen Compartido (Patrón Sidecar)
# Namespace Asignado: lab-pods
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab-pods
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-sidecar-logger
  namespace: lab-pods
  labels:
    app: multi-container-demo
spec:
  volumes:
    - name: shared-logs
      emptyDir: {}
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date '+%T') Evento en app" >> /var/log/app/events.log;
            sleep 5;
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app
    - name: sidecar
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          touch /var/log/app/events.log
          tail -n +1 -f /var/log/app/events.log
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app
