# =============================================================================
# Modulo 09: DaemonSets: Agentes de Nodo y Tolerancias
# Ejercicio 9.1: Agente de Recolección de Logs de Nodo montando /var/log
# Namespace Asignado: lab-daemonsets
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab-daemonsets
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ds-node-log-collector
  namespace: lab-daemonsets
  labels:
    app: node-logger
spec:
  selector:
    matchLabels:
      app: node-logger
  template:
    metadata:
      labels:
        app: node-logger
    spec:
      volumes:
        - name: host-logs
          hostPath:
            path: /var/log
            type: Directory
      containers:
        - name: log-collector
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "tail -n +1 -f /host/var/log/syslog || sleep 3600"
          volumeMounts:
            - name: host-logs
              mountPath: /host/var/log
              readOnly: true
