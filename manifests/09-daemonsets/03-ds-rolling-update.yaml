# =============================================================================
# Modulo 09: DaemonSets: Agentes de Nodo y Tolerancias
# Ejercicio 9.3: Actualización Controlada de DaemonSet (RollingUpdate vs OnDelete)
# Namespace Asignado: lab-daemonsets
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ds-node-log-collector
  namespace: lab-daemonsets
spec:
  selector:
    matchLabels:
      name: node-log-collector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        name: node-log-collector
    spec:
      containers:
        - name: collector
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
