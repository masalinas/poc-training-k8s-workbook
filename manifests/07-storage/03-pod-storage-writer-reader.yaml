# =============================================================================
# Modulo 07: Almacenamiento Persistente: PV y PVC
# Ejercicio 7.3: Persistencia de Datos entre el Ciclo de Vida de Pods Diferentes
# Namespace Asignado: lab-storage
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: pod-writer
  namespace: lab-storage
spec:
  volumes:
    - name: storage-vol
      persistentVolumeClaim:
        claimName: pvc-data-claim
  containers:
    - name: writer
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - "echo 'DATOS_PERSISTIDOS_OK' > /data/persist.txt; sleep 3600"
      volumeMounts:
        - name: storage-vol
          mountPath: /data
