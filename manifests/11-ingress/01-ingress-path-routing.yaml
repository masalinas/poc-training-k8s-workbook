# =============================================================================
# Modulo 11: Ingress: Controladores de Enrutamiento HTTP/HTTPS
# Ejercicio 11.1: Enrutamiento Basado en Rutas URL (Path-based Routing)
# Namespace Asignado: lab-ingress
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab-ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-catalog
  namespace: lab-ingress
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog }
  template:
    metadata: { labels: { app: catalog } }
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:latest
          args: ["-text=Modulo Catalogo", "-listen=:80"]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-catalog
  namespace: lab-ingress
spec:
  selector: { app: catalog }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-orders
  namespace: lab-ingress
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata: { labels: { app: orders } }
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:latest
          args: ["-text=Modulo Pedidos", "-listen=:80"]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-orders
  namespace: lab-ingress
spec:
  selector: { app: orders }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-path-routing
  namespace: lab-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /catalog
            pathType: Prefix
            backend:
              service:
                name: svc-catalog
                port:
                  number: 80
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: svc-orders
                port:
                  number: 80
