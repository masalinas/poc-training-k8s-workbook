# =============================================================================
# Modulo 04: Services: Abstracción de Red y Descubrimiento
# Ejercicio 4.1: Servicio ClusterIP con Desacoplamiento de Puertos y Endpoints
# Namespace Asignado: lab-services
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab-services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-api-node
  namespace: lab-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-node
  template:
    metadata:
      labels:
        app: api-node
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:latest
          args:
            - "-text=Respuesta de API"
            - "-listen=:3000"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: svc-api-node
  namespace: lab-services
spec:
  type: ClusterIP
  selector:
    app: api-node
  ports:
    - name: http
      port: 80
      targetPort: 3000
