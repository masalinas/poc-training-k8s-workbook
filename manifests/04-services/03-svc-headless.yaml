# =============================================================================
# Modulo 04: Services: Abstracción de Red y Descubrimiento
# Ejercicio 4.3: Headless Service (clusterIP: None) y Resolución DNS Directa
# Namespace Asignado: lab-services
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-cluster-members
  namespace: lab-services
spec:
  replicas: 3
  selector:
    matchLabels:
      role: member
  template:
    metadata:
      labels:
        role: member
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-headless
  namespace: lab-services
spec:
  clusterIP: None
  selector:
    role: member
  ports:
    - port: 80
      targetPort: 80
