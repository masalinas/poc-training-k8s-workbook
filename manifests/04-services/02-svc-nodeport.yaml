# =============================================================================
# Modulo 04: Services: Abstracción de Red y Descubrimiento
# Ejercicio 4.2: Exposición Externa mediante Servicio NodePort en Puerto Fijo
# Namespace Asignado: lab-services
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-admin
  namespace: lab-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-admin
  template:
    metadata:
      labels:
        app: web-admin
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-admin-nodeport
  namespace: lab-services
spec:
  type: NodePort
  selector:
    app: web-admin
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30088
