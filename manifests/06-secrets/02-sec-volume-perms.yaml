# =============================================================================
# Modulo 06: Secrets: Gestión Segura de Datos Sensibles
# Ejercicio 6.2: Montaje de Secret como Volumen con Permisos Restringidos (0400)
# Namespace Asignado: lab-secrets
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sec-api-token
  namespace: lab-secrets
type: Opaque
stringData:
  api-token.key: >-
    eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.token-secreto-de-produccion
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-restricted-secret
  namespace: lab-secrets
spec:
  volumes:
    - name: secret-volume
      secret:
        secretName: sec-api-token
        defaultMode: 0400 # Permiso de solo lectura para el dueño
  containers:
    - name: secure-app
      image: alpine:3.19
      command: ["/bin/sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/keys
          readOnly: true
