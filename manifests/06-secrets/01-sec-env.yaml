# =============================================================================
# Modulo 06: Secrets: Gestión Segura de Datos Sensibles
# Ejercicio 6.1: Creación de Secret Opaque (Base64) y Consumo Seguro en Variables
# Namespace Asignado: lab-secrets
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: pod-db-client
  namespace: lab-secrets
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: sec-db-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sec-db-credentials
              key: DB_PASSWORD
