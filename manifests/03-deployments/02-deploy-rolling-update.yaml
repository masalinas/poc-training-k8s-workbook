# =============================================================================
# Modulo 03: Deployments: Actualizaciones Continuas y Estrategias Rollout
# Ejercicio 3.2: RollingUpdate Controlado con maxSurge y maxUnavailable
# Namespace Asignado: lab-deployments
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-rolling-tuned
  namespace: lab-deployments
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rolling-tuned
  template:
    metadata:
      labels:
        app: rolling-tuned
    spec:
      containers:
        - name: httpd
          image: httpd:2.4-alpine
          ports:
            - containerPort: 80
