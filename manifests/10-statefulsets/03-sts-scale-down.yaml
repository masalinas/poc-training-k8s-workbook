# =============================================================================
# Modulo 10: StatefulSets: Identidad Estable y Almacenamiento Persistente Ordenado
# Ejercicio 10.3: Escalado Ordenado Inverso y Política de Preservación de PVCs
# Namespace Asignado: lab-statefulsets
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sts-web
  namespace: lab-statefulsets
spec:
  serviceName: "sts-web-service"
  replicas: 3
  selector:
    matchLabels:
      app: sts-web
  template:
    metadata:
      labels:
        app: sts-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
